name: Refresh live AI feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh live public data snapshot
        run: python scripts/refresh-public-data.py

      - name: Refresh research and news feeds
        run: python scripts/refresh-live-feeds.py

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/real/verified-metrics.json public/data/live/live-feeds.json
          git diff --cached --quiet || git commit -m "Refresh live public AI data"
          git push
